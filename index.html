<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恏微美學牙醫診所 - 門診線上預約</title>
  <style>
    :root {
      --primary-color: #275c53;
      --accent-color: #c5a880;
      --bg-color: #f9f8f4;
      --card-bg: #ffffff;
      --text-color: #333333;
      --line-green: #06c755;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      background: var(--card-bg);
      max-width: 520px;
      width: 100%;
      padding: 32px 28px;
      border-radius: 14px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.07);
    }
    h1 {
      text-align: center;
      color: var(--primary-color);
      font-size: 1.55rem;
      margin: 0 0 6px 0;
      font-weight: 700;
    }
    p.subtitle {
      text-align: center;
      color: #777;
      font-size: 0.88rem;
      margin: 0 0 24px 0;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: var(--primary-color);
      font-size: 0.92rem;
    }
    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #dcdad5;
      border-radius: 7px;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
      background-color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(39, 92, 83, 0.12);
    }
    option:disabled {
      color: #aaa !important;
      background-color: #f2f2f2;
      text-decoration: line-through;
    }
    .helper-text {
      font-size: 0.82rem;
      color: #888;
      margin-top: 5px;
      line-height: 1.4;
    }
    .btn-submit {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 13px;
      width: 100%;
      border-radius: 7px;
      font-size: 1.02rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      transition: background-color 0.2s, opacity 0.2s;
    }
    .btn-submit:hover:not(:disabled) {
      background-color: #1a3f39;
    }
    .btn-submit:disabled {
      background-color: #8fa5a0;
      cursor: not-allowed;
    }
    .notice {
      margin-top: 20px;
      padding: 12px 14px;
      background: #f4f6f5;
      border-left: 4px solid var(--primary-color);
      font-size: 0.82rem;
      color: #555;
      line-height: 1.6;
      border-radius: 0 6px 6px 0;
    }

    /* 預約成功彈窗 Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(3px);
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
      box-sizing: border-box;
    }
    .modal-box {
      background: #ffffff;
      border-radius: 16px;
      max-width: 440px;
      width: 100%;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      animation: popIn 0.25s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-icon {
      width: 52px;
      height: 52px;
      line-height: 52px;
      border-radius: 50%;
      background: #eaf5f2;
      color: var(--primary-color);
      font-size: 26px;
      margin: 0 auto 12px auto;
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-color);
      margin: 0 0 8px 0;
    }
    .modal-info {
      font-size: 0.9rem;
      color: #444;
      background: #fbf9f6;
      border: 1px solid #ede8e0;
      padding: 14px 16px;
      border-radius: 8px;
      text-align: left;
      line-height: 1.7;
      margin: 14px 0 16px 0;
    }
    .modal-desc {
      font-size: 0.86rem;
      color: #666;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .btn-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--line-green);
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: opacity 0.2s;
    }
    .btn-line:hover {
      opacity: 0.92;
    }
    .btn-close {
      background: transparent;
      border: 1px solid #dcdad5;
      color: #777;
      padding: 9px 18px;
      font-size: 0.88rem;
      border-radius: 7px;
      cursor: pointer;
      width: 100%;
    }
    .btn-close:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>門診預約掛號</h1>
  <p class="subtitle">本診所採預約制，已額滿與國定放假日將自動鎖定</p>

  <form id="bookingForm">
    <div class="form-group">
      <label for="doctor">看診醫師 *</label>
      <select id="doctor" required>
        <option value="">-- 請先選擇看診醫師 --</option>
        <option value="劉宗豪 醫師">劉宗豪 醫師 (週三午/晚、週五早/午/晚)</option>
        <option value="吳國柱 醫師">吳國柱 醫師 (週一午、週二晚、週三午、週四晚、週五午)</option>
        <option value="劉承皓 醫師">劉承皓 醫師 (週二午/晚)</option>
        <option value="特約門診" disabled style="color: #999; background-color: #f5f5f5;">特約門診 (請直接撥打電話or加官方LINE，不開放線上預約)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="bookDate">預約日期 (限兩個月內) *</label>
      <input type="date" id="bookDate" required>
      <div class="helper-text" id="dateHint">僅開放當日起兩個月內的門診預約</div>
    </div>

    <div class="form-group">
      <label for="timeSlot">預約時段 (每格 30 分鐘) *</label>
      <select id="timeSlot" required disabled>
        <option value="">-- 請先選擇醫師與日期 --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="patientName">病患姓名 *</label>
      <input type="text" id="patientName" placeholder="請輸入姓名" required>
    </div>

    <div class="form-group">
      <label for="patientPhone">聯絡電話 *</label>
      <input type="tel" id="patientPhone" placeholder="例如：0912345678" required>
    </div>

    <div class="form-group">
      <label for="notes">備註說明（選填）</label>
      <textarea id="notes" rows="2" placeholder="初診/複診、或主要想諮詢調理之項目"></textarea>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">確認預約並送出</button>
  </form>

  <div class="notice">
    ※ 特約門診時段不開放線上登記，請直接撥打診所專線 (02) 8258-8028 或透過官方 LINE 預約[cite: 1]。<br>
    ※ 國定假日與政府公告放假日全天休診，不開放預約。<br>
    ※ 網站預約為初步預約，會有專人與您聯繫再次確認預約時段。
  </div>
</div>

<!-- 預約成功 + LINE 導流彈窗 -->
<div class="modal-overlay" id="successModal">
  <div class="modal-box">
    <div class="modal-icon">✓</div>
    <div class="modal-title">初步預約已送出</div>
    <div class="modal-info" id="modalBookingDetails"></div>
    <div class="modal-desc">
      網站預約為初步登記，後續將有專人與您電話聯繫確認。<br>
      <strong>建議加入官方 LINE，可即時掌握排程進度與就診提醒！</strong>
    </div>
    
    <a href="https://line.me/R/ti/p/@haowei" target="_blank" class="btn-line">
      <span>💬 加入官方 LINE 掌握預約</span>
    </a>
    <button type="button" class="btn-close" onclick="closeModal()">關閉視窗</button>
  </div>
</div>

<script>
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzfmrYdU2KUuZeKEjRJt8WX-iWnM83wgEg7wXa7MhTWYRugx44cyk6gZbPb2APRVQh9/exec";

  const dateInput = document.getElementById('bookDate');
  const doctorSelect = document.getElementById('doctor');
  const timeSlotSelect = document.getElementById('timeSlot');
  const dateHint = document.getElementById('dateHint');

  const now = new Date();
  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const minDateStr = `${yyyy}-${mm}-${dd}`;

  const maxDate = new Date();
  maxDate.setMonth(maxDate.getMonth() + 2);
  const maxY = maxDate.getFullYear();
  const maxM = String(maxDate.getMonth() + 1).padStart(2, '0');
  const maxD = String(maxDate.getDate()).padStart(2, '0');
  const maxDateStr = `${maxY}-${maxM}-${maxD}`;

  dateInput.min = minDateStr;
  dateInput.max = maxDateStr;

  // 行政院公佈放假日 (依據提供的日曆粉紅色放假日更新)
  const NATIONAL_HOLIDAYS = {
    // 2026年 9月~12月
    "2026-09-25": "中秋節放假日",
    "2026-09-28": "教師節放假日",
    "2026-10-09": "國慶連假調整放假日",
    "2026-10-10": "國慶日",
    "2026-10-26": "臺灣光復節補假",
    "2026-12-25": "行憲紀念日",
    // 2027年常見公休日
    "2027-01-01": "元旦開國紀念日",
    "2027-02-05": "農曆除夕前一日",
    "2027-02-06": "除夕",
    "2027-02-07": "春節",
    "2027-02-08": "春節初二",
    "2027-02-09": "春節初三",
    "2027-02-28": "和平紀念日"
  };

  const SLOT_DETAILS = {
    "morning": {
      label: "早診",
      slots: ["10:00 - 10:30", "10:30 - 11:00", "11:00 - 11:30", "11:30 - 12:00", "12:00 - 12:30"]
    },
    "afternoon": {
      label: "午診",
      slots: ["14:00 - 14:30", "14:30 - 15:00", "15:00 - 15:30", "15:30 - 16:00", "16:00 - 16:30", "16:30 - 17:00", "17:00 - 17:30"]
    },
    "evening": {
      label: "晚診",
      slots: ["18:00 - 18:30", "18:30 - 19:00", "19:00 - 19:30", "19:30 - 20:00", "20:00 - 20:30", "20:30 - 21:00", "21:00 - 21:30"]
    }
  };

  const DOCTOR_SCHEDULES = {
    "劉宗豪": {
      3: ["afternoon", "evening"],
      5: ["morning", "afternoon", "evening"]
    },
    "吳國柱": {
      1: ["afternoon"],
      2: ["evening"],
      3: ["afternoon"],
      4: ["evening"],
      5: ["afternoon"]
    },
    "劉承皓": {
      2: ["afternoon", "evening"]
    }
  };

  window.handleBookedSlots = function(data) {
    if (data && data.bookedSlots && data.bookedSlots.length > 0) {
      data.bookedSlots.forEach(slotTime => {
        const optId = `slot-${slotTime.replace(/[: -]/g, '')}`;
        const opt = document.getElementById(optId);
        if (opt) {
          opt.textContent = opt.textContent.replace(" (已額滿)", "") + " (已額滿)";
          opt.disabled = true;
        }
      });
      dateHint.innerText = "✅ 該日有開診，已額滿時段已為您反灰標示。";
      dateHint.style.color = "#275c53";
    } else {
      dateHint.innerText = "✅ 該日有開診，目前所有時段皆可預約。";
      dateHint.style.color = "#275c53";
    }
  };

  function updateSlotOptions() {
    const doctorRaw = doctorSelect.value;
    const dateVal = dateInput.value;

    timeSlotSelect.innerHTML = '<option value="">-- 請選擇時段 --</option>';
    timeSlotSelect.disabled = true;
    dateHint.style.color = "#888";
    dateHint.innerText = `僅開放 ${minDateStr} 至 ${maxDateStr} (兩個月內) 之預約`;

    if (!doctorRaw) return;

    if (doctorRaw.indexOf("特約") !== -1) {
      dateHint.innerText = "⚠️ 特約診時段請直接撥打電話 (02) 8258-8028 或加官方 LINE 預約，不開放線上預約[cite: 1]。";
      dateHint.style.color = "#d93025";
      return;
    }

    if (!dateVal) return;

    // 1. 行政院公告放假日檢查鎖定 (含 9/28 教師節)
    if (NATIONAL_HOLIDAYS[dateVal]) {
      dateHint.innerText = `❌ 休診提醒：${dateVal} 為政府公告【${NATIONAL_HOLIDAYS[dateVal]}】全天休診，不開放預約。`;
      dateHint.style.color = "#d93025";
      return;
    }

    // 2. 兩個月範圍檢查
    if (dateVal < minDateStr || dateVal > maxDateStr) {
      dateHint.innerText = `❌ 預約日期僅限兩個月內，請重新挑選。`;
      dateHint.style.color = "#d93025";
      return;
    }

    const parts = dateVal.split('-');
    const pickedDate = new Date(parts[0], parts[1] - 1, parts[2]);
    const dayOfWeek = pickedDate.getDay();

    // 3. 週日固定休診
    if (dayOfWeek === 0) {
      dateHint.innerText = "❌ 診所每週日全天休診，請選擇其他就診日期。";
      dateHint.style.color = "#d93025";
      return;
    }

    const docKey = doctorRaw.substring(0, 3);
    const doctorRules = DOCTOR_SCHEDULES[docKey];
    const availableShifts = doctorRules ? doctorRules[dayOfWeek] : null;

    if (!availableShifts || availableShifts.length === 0) {
      const dayNames = ["日", "一", "二", "三", "四", "五", "六"];
      dateHint.innerText = `❌ ${doctorRaw} 於週${dayNames[dayOfWeek]}無門診，請挑選其他日期。`;
      dateHint.style.color = "#d93025";
      return;
    }

    dateHint.innerText = "⏳ 正在同步診所名額狀態...";
    dateHint.style.color = "#888";
    timeSlotSelect.disabled = false;
    timeSlotSelect.innerHTML = '<option value="">-- 請選擇時段 --</option>';

    availableShifts.forEach(shiftKey => {
      const group = document.createElement("optgroup");
      group.label = `【${SLOT_DETAILS[shiftKey].label}】`;

      SLOT_DETAILS[shiftKey].slots.forEach(slotTime => {
        const opt = document.createElement("option");
        opt.value = slotTime;
        opt.textContent = `${SLOT_DETAILS[shiftKey].label} ${slotTime}`;
        opt.id = `slot-${slotTime.replace(/[: -]/g, '')}`;
        group.appendChild(opt);
      });

      timeSlotSelect.appendChild(group);
    });

    const oldScript = document.getElementById('jsonp-check-slot');
    if (oldScript) oldScript.remove();

    const script = document.createElement('script');
    script.id = 'jsonp-check-slot';
    script.src = `${GAS_API_URL}?doctor=${encodeURIComponent(doctorRaw)}&date=${encodeURIComponent(dateVal)}&callback=handleBookedSlots`;
    document.body.appendChild(script);
  }

  doctorSelect.addEventListener('change', updateSlotOptions);
  dateInput.addEventListener('change', updateSlotOptions);

  function closeModal() {
    document.getElementById('successModal').style.display = 'none';
  }

  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const doctor = doctorSelect.value;
    const bookDate = dateInput.value;
    const timeSlot = timeSlotSelect.value;
    const patientName = document.getElementById('patientName').value.trim();
    const patientPhone = document.getElementById('patientPhone').value.trim();
    const notes = document.getElementById('notes').value.trim();

    if (NATIONAL_HOLIDAYS[bookDate]) {
      alert(`該日為政府公告放假日【${NATIONAL_HOLIDAYS[bookDate]}】全日休診，不開放預約！`);
      return;
    }

    if (doctor.indexOf("特約") !== -1) {
      alert("特約門診請直接撥打電話 (02) 8258-8028 或加官方 LINE 預約！[cite: 1]");
      return;
    }

    if (timeSlotSelect.disabled || !timeSlot) {
      alert("請選擇有效的門診時段！");
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "預約排程中，請稍候...";

    const payload = {
      doctor: doctor,
      bookDate: bookDate,
      timeSlot: timeSlot,
      patientName: patientName,
      patientPhone: patientPhone,
      notes: notes
    };

    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(result => {
      if (result.status === "success") {
        document.getElementById('modalBookingDetails').innerHTML = `
          <strong>就診貴賓：</strong>${patientName}<br>
          <strong>聯絡電話：</strong>${patientPhone}<br>
          <strong>看診醫師：</strong>${doctor}<br>
          <strong>預約時段：</strong>${bookDate} ${timeSlot}
        `;
        document.getElementById('successModal').style.display = 'flex';
        document.getElementById('bookingForm').reset();
        updateSlotOptions();
      } else if (result.status === "full") {
        alert(`⚠️ 【預約未成功】\n\n${result.message}`);
        updateSlotOptions();
      } else {
        alert("系統回報異常：" + result.message);
      }
    })
    .catch(err => {
      console.error(err);
      alert("連線驗證異常，請直接致電診所或透過官方 LINE 預約。");
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = "確認預約並送出";
    });
  });
</script>

</body>
</html>
